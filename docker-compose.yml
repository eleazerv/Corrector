services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    image: joints-backend
    env_file: ./backend/.env.docker
    environment:
      REDIS_URL: redis://redis:6379        # menimpa nilai di env_file
    expose: ["8000"]                       # cuma bisa diakses dari jaringan compose (nginx)
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    image: joints-backend
    env_file: ./backend/.env.docker
    environment: { REDIS_URL: redis://redis:6379 }
    command: arq core.worker.WorkerSettings
    restart: unless-stopped
    stop_grace_period: 60s
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      api: { condition: service_healthy }

  worker-ocr:
    image: joints-backend
    env_file: ./backend/.env.docker
    environment: { REDIS_URL: redis://redis:6379 }
    command: arq core.worker.OcrWorkerSettings
    restart: unless-stopped
    stop_grace_period: 60s
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      api: { condition: service_healthy }

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_healthy }