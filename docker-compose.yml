services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    image: joints-backend
    env_file: ./backend/.env.docker
    environment:
      REDIS_URL: redis://redis:6379        # menimpa nilai di env_file
    expose: ["8000"]                       # cuma bisa diakses dari jaringan compose (nginx)
    restart: unless-stopped
    networks: [default, supabase]          # akses Supabase lewat network internal
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    image: joints-backend
    env_file: ./backend/.env.docker
    environment: { REDIS_URL: redis://redis:6379 }
    command: arq core.worker.WorkerSettings
    restart: unless-stopped
    stop_grace_period: 60s
    networks: [default, supabase]          #  akses Supabase lewat network internal
    depends_on:
      api: { condition: service_healthy }

  worker-ocr:
    image: joints-backend
    env_file: ./backend/.env.docker
    environment: { REDIS_URL: redis://redis:6379 }
    command: arq core.worker.OcrWorkerSettings
    restart: unless-stopped
    stop_grace_period: 60s
    networks: [default, supabase]          #  akses Supabase lewat network internal
    depends_on:
      api: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-/}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_DEMO_DOSEN_EMAIL: ${NEXT_PUBLIC_DEMO_DOSEN_EMAIL:-dosen01@und.joints.test}
        NEXT_PUBLIC_DEMO_MAHASISWA_EMAIL: ${NEXT_PUBLIC_DEMO_MAHASISWA_EMAIL:-mhs001@und.joints.test}
        NEXT_PUBLIC_DEMO_PASSWORD: ${NEXT_PUBLIC_DEMO_PASSWORD:-Joints123!}
    image: joints-frontend
    expose: ["3000"]                       # cuma lewat nginx
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["0.0.0.0:80:80"]               #  satu-satunya port publik
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [default, supabase]          #  akses Supabase lewat network internal
    depends_on:
      api: { condition: service_healthy }
      frontend: { condition: service_started }

# network yang dibuat `npx supabase start` (nama = supabase_network_<project_id>).
# Jalankan Supabase dulu sebelum `docker compose up`, kalau tidak compose error "network not found".
networks:
  supabase:
    external: true
    name: supabase_network_JOINTS
