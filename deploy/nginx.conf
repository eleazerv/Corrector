upstream joints_api { server api:8000; }
upstream joints_fe { server frontend:3000; }
# Supabase dicapai lewat network Docker milik Supabase CLI
# (container supabase_kong_JOINTS), bukan lewat port host -> port 54321 boleh ditutup dari luar.
upstream supabase  { server supabase_kong_JOINTS:8000; }

#  batasi percobaan login per IP (anti brute force)
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    client_max_body_size 60m;

    location ~ ^/api/v1/.*/events$ {
        proxy_pass http://joints_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://joints_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health { proxy_pass http://joints_api; }
    location /docs { proxy_pass http://joints_api; }
    location /openapi.json { proxy_pass http://joints_api; }

    #  Supabase TIDAK dibuka utuh ke publik. Key lokal Supabase
    # (anon/service_role) bernilai default dan diketahui semua orang, jadi hanya endpoint
    # yang dipakai FE yang diteruskan; sisanya 403.
    # FE hanya memanggil POST /auth/v1/token (login password + refresh token).
    location = /auth/v1/token {
        limit_except POST { deny all; }
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://supabase;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /auth/v1/ { return 403; }

    # browser hanya membuka signed URL foto
    # (GET /storage/v1/object/sign/...?token=...). Upload, list, hapus, admin storage
    # dilakukan backend lewat network internal, jadi di sini ditolak.
    location ^~ /storage/v1/object/sign/ {
        limit_except GET { deny all; }
        proxy_pass http://supabase;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /storage/v1/ { return 403; }

    location / {
        proxy_pass http://joints_fe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
